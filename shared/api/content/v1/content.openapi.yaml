openapi: 3.0.3

info:
  title: Relay Content API
  version: 1.0.0
  description: |
    Public HTTP contract for Relay Content Stage 1.

    The API captures URL and text sources, exposes Item user context, and provides
    Recent, Library, Later, and Search read surfaces. The authenticated owner is
    derived from Identity and is never supplied by the client.

    Capture, Item mutations, ordinary reads, and Search have separate per-user
    refill budgets shared across sessions. Admission follows JWT/CSRF validation
    and request decoding and precedes database work. Rejection returns 429
    TOO_MANY_REQUESTS with Retry-After in whole seconds. During Redis outages,
    bounded process-wide fallback budgets protect each operation group.

servers:
  - url: /

tags:
  - name: Capture
    description: Capture immutable URL or text sources.
  - name: Items
    description: Read, update, and delete owner-scoped Items.
  - name: Collections
    description: Read owner-scoped Recent, Library, Later, and Search views.

security:
  - accessCookie: []

x-ogen:
  target: ./shared/pkg/openapi/content/v1
  package: content_v1
  clean: true

paths:
  /api/v1/items:
    $ref: ./paths/items.yaml
  /api/v1/items/recent:
    $ref: ./paths/items_recent.yaml
  /api/v1/items/library:
    $ref: ./paths/items_library.yaml
  /api/v1/items/later:
    $ref: ./paths/items_later.yaml
  /api/v1/items/search:
    $ref: ./paths/items_search.yaml
  /api/v1/items/{item_id}:
    $ref: ./paths/item_by_id.yaml

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: __Host-relay_access
      description: >-
        Secure, HttpOnly, SameSite=Lax short-lived signed Relay JWT, Path=/;
        verified locally without an Identity request.
    csrfHeader:
      type: apiKey
      in: header
      name: X-Csrf-Token
      description: >-
        For mutations, requires exact Origin, equality with __Host-relay_csrf cookie,
        and a hash matching the verified access JWT csrf_hash.
