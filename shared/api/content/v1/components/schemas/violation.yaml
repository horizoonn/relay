type: object
additionalProperties: false
required:
  - pointer
  - code
  - message
properties:
  pointer:
    type: string
    description: JSON Pointer to the invalid request member; empty for a document-level violation.
  code:
    type: string
    minLength: 1
    maxLength: 64
    pattern: '^[A-Z][A-Z0-9_]*$'
  message:
    type: string
    minLength: 1
    maxLength: 512
    description: Human-readable diagnostic text; not a stable client contract.
