type: object
additionalProperties: false
required: [session_id, created_at, authenticated_at, last_seen_at, expires_at, is_current]
properties:
  session_id:
    type: string
    format: uuid
  created_at:
    type: string
    format: date-time
  authenticated_at:
    type: string
    format: date-time
  last_seen_at:
    type: string
    format: date-time
    description: Time of creation or last refresh; Content activity is not tracked.
  expires_at:
    type: string
    format: date-time
  is_current:
    type: boolean
    description: True for the session making this request.
