type: object
additionalProperties: false
required:
  - email
  - password
properties:
  email:
    type: string
    minLength: 1
    maxLength: 254
    description: Email address; surrounding whitespace is trimmed and the domain is lowercased.
  password:
    type: string
    minLength: 1
    maxLength: 128
    description: Used exactly as supplied, including whitespace.
