type: object
additionalProperties: false
required: [token, password]
properties:
  token:
    type: string
    minLength: 43
    maxLength: 43
    pattern: '^[A-Za-z0-9_-]+$'
  password:
    type: string
    minLength: 15
    maxLength: 128
    description: New password with 15 to 128 Unicode code points, without composition rules.
