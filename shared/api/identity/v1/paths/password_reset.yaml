post:
  operationId: ResetPassword
  summary: Reset the password
  description: |
    Replaces the password using a one-time token. Also confirms the email,
    revokes all sessions, and invalidates other reset tokens. Invalid, expired,
    or used tokens return INVALID_TOKEN. Clears browser cookies after success;
    log in with the new password.
  tags: [Authentication]
  security: []
  parameters:
    - $ref: ../components/parameters/origin.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/password_reset.yaml
  responses:
    '204':
      description: Password reset and sessions revoked.
      headers:
        X-Request-Id:
          $ref: ../components/headers/x_request_id.yaml
        Set-Cookie:
          required: true
          description: Clears the three browser cookies after a successful reset.
          schema:
            type: array
            minItems: 3
            maxItems: 3
            items:
              type: string
    '400':
      $ref: ../components/responses/problem.yaml
    '403':
      $ref: ../components/responses/problem.yaml
    '413':
      $ref: ../components/responses/problem.yaml
    '415':
      $ref: ../components/responses/problem.yaml
    '429':
      $ref: ../components/responses/problem.yaml
    '503':
      $ref: ../components/responses/problem.yaml
    '500':
      $ref: ../components/responses/problem.yaml
    'default':
      $ref: ../components/responses/problem.yaml
