post:
  operationId: RequestEmailVerification
  summary: Request email verification
  description: |
    Requests a confirmation link by email. Delivery is asynchronous;
    the response does not reveal whether the account exists.
  tags: [Authentication]
  security: []
  parameters:
    - $ref: ../components/parameters/origin.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/email_request.yaml
  responses:
    '202':
      description: Request accepted.
      headers:
        X-Request-Id:
          $ref: ../components/headers/x_request_id.yaml
    '400':
      $ref: ../components/responses/problem.yaml
    '403':
      $ref: ../components/responses/problem.yaml
    '413':
      $ref: ../components/responses/problem.yaml
    '415':
      $ref: ../components/responses/problem.yaml
    '429':
      $ref: ../components/responses/problem.yaml
    '503':
      $ref: ../components/responses/problem.yaml
    '500':
      $ref: ../components/responses/problem.yaml
    'default':
      $ref: ../components/responses/problem.yaml
