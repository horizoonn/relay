name: Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'

      - name: Set up Task
        uses: arduino/setup-task@v3.0.0

      - name: Check dependencies
        run: task deps:check

      - name: Check formatting
        run: task fmt:check

      - name: Run linters
        run: task lint

      - name: Run go vet
        run: task vet

      - name: Build
        run: task build
