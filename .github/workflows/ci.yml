name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality-reusable.yml

  test:
    uses: ./.github/workflows/test-reusable.yml

  contracts:
    uses: ./.github/workflows/contracts-reusable.yml

  security:
    uses: ./.github/workflows/security-reusable.yml