name: Contracts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Set up Task
        uses: arduino/setup-task@v3.0.0

      - name: Lint contracts
        run: task contracts:lint

      - name: Generate contracts
        run: task generate

      - name: Compile generated OpenAPI code
        working-directory: shared
        run: GOWORK=off go test ./...

      - name: Check bundled contracts
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Check breaking changes
        if: github.event_name == 'pull_request'
        run: task proto:breaking
