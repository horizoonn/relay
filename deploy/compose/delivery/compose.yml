services:
  delivery-migrate:
    build:
      context: ../../..
      dockerfile: delivery/Dockerfile
      target: migrate
      args:
        GOOSE_VERSION: ${GOOSE_VERSION}
    environment:
      GOOSE_DBSTRING: >-
        host=postgres port=5432 user=${DELIVERY_MIGRATOR_USER}
        password=${DELIVERY_MIGRATOR_PASSWORD} dbname=${DELIVERY_DB} sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - relay-net
