services:
  content-migrate:
    build:
      context: ../../..
      dockerfile: content/Dockerfile
      target: migrate
      args:
        GOOSE_VERSION: ${GOOSE_VERSION}
    environment:
      GOOSE_DBSTRING: >-
        host=postgres port=5432 user=${CONTENT_MIGRATOR_USER}
        password=${CONTENT_MIGRATOR_PASSWORD} dbname=${CONTENT_DB} sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - relay-net
