services:
  content:
    build:
      context: ../../..
      dockerfile: content/Dockerfile
      target: runtime
    env_file:
      - ../../env/content.env
    environment:
      CONTENT_HTTP_ADDR: ":8080"
      CONTENT_DB_HOST: postgres
      CONTENT_DB_PORT: "5432"
      CONTENT_REDIS_ADDR: redis:6379
      CONTENT_ALLOWED_ORIGIN: ${CONTENT_ALLOWED_ORIGIN:-https://localhost}
      # Runtime never receives the migrator role credentials from env_file.
      CONTENT_MIGRATOR_USER: ""
      CONTENT_MIGRATOR_PASSWORD: ""
      CONTENT_ACCESS_PUBLIC_KEY_FILES: ${CONTENT_ACCESS_PUBLIC_KEY_FILES:-local-1=/run/keys/identity-public.pem}
    ports:
      - "${CONTENT_HTTP_BIND_HOST:-127.0.0.1}:${CONTENT_HTTP_PORT:-8080}:8080"
    volumes:
      - ../../identity/keys/public.pem:/run/keys/identity-public.pem:ro
    depends_on:
      content-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 2m5s
    networks:
      - relay-net
      - rate-limit

  content-migrate:
    build:
      context: ../../..
      dockerfile: content/Dockerfile
      target: migrate
      args:
        GOOSE_VERSION: ${GOOSE_VERSION}
    environment:
      GOOSE_DBSTRING: >-
        host=postgres port=5432 user=${CONTENT_MIGRATOR_USER}
        password=${CONTENT_MIGRATOR_PASSWORD} dbname=${CONTENT_DB} sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - relay-net
