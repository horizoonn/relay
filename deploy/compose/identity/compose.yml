services:
  identity:
    build:
      context: ../../..
      dockerfile: identity/Dockerfile
      target: runtime
    env_file:
      - ../../env/identity.env
    environment:
      IDENTITY_HTTP_ADDR: ":8080"
      IDENTITY_DB_HOST: postgres
      IDENTITY_DB_PORT: "5432"
      IDENTITY_REDIS_ADDR: redis:6379
      IDENTITY_ALLOWED_ORIGIN: ${IDENTITY_ALLOWED_ORIGIN:-https://localhost}
      # Runtime never receives the migrator role credentials from env_file.
      IDENTITY_MIGRATOR_USER: ""
      IDENTITY_MIGRATOR_PASSWORD: ""
      IDENTITY_SIGNING_KEY_FILE: /run/secrets/identity_signing_key
      IDENTITY_SIGNING_KEY_ID: ${IDENTITY_SIGNING_KEY_ID:-local-1}
      IDENTITY_TRUSTED_PROXY_PREFIXES: ${IDENTITY_PROXY_SUBNET:-172.31.254.0/28}
    secrets:
      - identity_signing_key
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
    stop_grace_period: 2m5s
    restart: unless-stopped
    networks:
      relay-net: {}
      rate-limit: {}
      identity-mail: {}
      identity-proxy:
        aliases: [identity-api]

  identity-migrate:
    build:
      context: ../../..
      dockerfile: identity/Dockerfile
      target: migrate
      args:
        GOOSE_VERSION: ${GOOSE_VERSION}
    environment:
      GOOSE_DBSTRING: >-
        host=postgres port=5432 user=${IDENTITY_MIGRATOR_USER}
        password=${IDENTITY_MIGRATOR_PASSWORD} dbname=${IDENTITY_DB} sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - relay-net

secrets:
  identity_signing_key:
    file: ../../identity/keys/signing.pem
