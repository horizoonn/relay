services:
  identity-migrate:
    build:
      context: ../../..
      dockerfile: identity/Dockerfile
      target: migrate
      args:
        GOOSE_VERSION: ${GOOSE_VERSION}
    environment:
      GOOSE_DBSTRING: >-
        host=postgres port=5432 user=${IDENTITY_MIGRATOR_USER}
        password=${IDENTITY_MIGRATOR_PASSWORD} dbname=${IDENTITY_DB} sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - relay-net
