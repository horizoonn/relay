services:
  redis:
    image: redis:8.4.7-trixie
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 64mb, --maxmemory-policy, noeviction]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 2s
      retries: 12
    restart: unless-stopped
    networks:
      - rate-limit

networks:
  rate-limit:
    internal: true
